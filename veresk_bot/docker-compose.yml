services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/veresk.db
      SESSIONS_DIR: /app/data/sessions
    expose:
      - "3005"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      - redis

  # MAX-бот (анкета как в Telegram, без Mini App).
  # Токен: Настройки → MAX в админке (runtime_settings) или MAX_BOT_TOKEN в .env.
  # Без токена процесс ждёт, не падает в crash-loop.
  max_bot:
    build: .
    command: ["python", "-m", "max_bot.main"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/veresk.db
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "3005:3005"
      # 80/443 — только если нет другого веб-сервера (см. nginx.ssl.conf.example)
      # - "80:80"
      # - "443:443"
    volumes:
      - ./miniapp:/usr/share/nginx/html/miniapp:ro
      - ./adminapp:/usr/share/nginx/html/admin:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - bot

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  redis_data:
