# admin.veresk-flowers.ru — админка на /, Mini App /miniapp/, API /api/
# volumes: adminapp → /usr/share/nginx/admin, miniapp → /usr/share/nginx/html/miniapp

server {
    listen 3005;
    server_name admin.veresk-flowers.ru _;

    client_max_body_size 25m;

    location /miniapp/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /miniapp/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /api/admin/max-chats/events {
        proxy_pass http://bot:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        add_header X-Accel-Buffering no;
    }

    # Логин личного MAX (SMS) может ждать до ~90с
    location /api/admin/accounts/max/userbot/ {
        proxy_pass http://bot:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
        proxy_redirect off;
    }

    location /api/ {
        proxy_pass http://bot:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Telegram-Init-Data $http_x_telegram_init_data;
        proxy_set_header Authorization $http_authorization;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }

    location = /admin {
        return 301 /;
    }
    location = /admin/ {
        return 301 /;
    }
    location ~ ^/admin/(?<rest>.*)$ {
        return 301 /$rest;
    }

    # админка на корне (отдельный mount, не пересекается с miniapp)
    location / {
        root /usr/share/nginx/admin;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
