# Основной конфиг: порт 3005 (для прокси с хоста или без SSL в контейнере).
# Домен: admin.veresk-flowers.ru — админка на /, Mini App на /miniapp/, API на /api/
# HTTPS: NPM / nginx.host-proxy / nginx.ssl.conf.example

server {
    listen 3005;
    server_name admin.veresk-flowers.ru _;

    client_max_body_size 25m;

    location /miniapp/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /miniapp/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* /miniapp/.*\.(css|js)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # совместимость: /admin → /
    location = /admin {
        return 301 /;
    }
    location /admin/ {
        rewrite ^/admin/(.*)$ /$1 permanent;
    }

    location /api/admin/max-chats/events {
        proxy_pass http://bot:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        proxy_pass http://bot:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Telegram-Init-Data $http_x_telegram_init_data;
        proxy_set_header Authorization $http_authorization;
    }

    # Админка на корне домена
    location / {
        root /usr/share/nginx/html/admin;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
