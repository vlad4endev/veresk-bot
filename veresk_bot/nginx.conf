# admin.veresk-flowers.ru — админка на /, Mini App /miniapp/, API /api/
# adminapp смонтирован в /usr/share/nginx/html (см. docker-compose)

server {
    listen 3005;
    server_name admin.veresk-flowers.ru _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    location /miniapp/ {
        try_files $uri $uri/ /miniapp/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /api/admin/max-chats/events {
        proxy_pass http://bot:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        proxy_pass http://bot:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Telegram-Init-Data $http_x_telegram_init_data;
        proxy_set_header Authorization $http_authorization;
        # не переписывать Location на :3005
        proxy_redirect off;
    }

    # старые закладки /admin → /
    location = /admin {
        return 301 /;
    }
    location = /admin/ {
        return 301 /;
    }
    location ~ ^/admin/(?<rest>.*)$ {
        return 301 /$rest;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
